{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% csrf_token %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA== " crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://fonts.googleapis.com/css2?family=Protest+Riot&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'Core/css/style.css' %}?v=1.1">
    <link rel="stylesheet" href="{% static 'Core/css/crousels.css' %}">
    {% block links %} {% endblock %}

    <title>{% block title %}{% endblock title %}</title>
</head>
<body style="position: relative;">
    <!-- Global Page Loader -->
    <div id="global-loader">
        <div class="loader-logo">⧲ DineSphere</div>
        <div class="loader-spinner"></div>
    </div>
    <script>
        // Dismiss loader as soon as DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            var loader = document.getElementById('global-loader');
            if (loader) {
                loader.classList.add('loader-fade-out');
                setTimeout(function() { loader.style.display = 'none'; }, 400);
            }
        });
        // Also dismiss on back-button (bfcache)
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                var loader = document.getElementById('global-loader');
                if (loader) {
                    loader.classList.add('loader-fade-out');
                    setTimeout(function() { loader.style.display = 'none'; }, 400);
                }
            }
        });
    </script>
    {% if messages %}
    <div class="global-messages">
        {% for message in messages %}
        <div class="alert-msg {{ message.tags }}">
            <i class="fas {% if 'error' in message.tags %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block main %}{% endblock %}
    {% block footer %} 
    
    {% endblock footer %}
    
    
    <script>
        const IS_AUTHENTICATED = {{ request.user.is_authenticated|yesno:"true,false" }};
    </script>
    <script src="{% static 'Core/js/crousels.js' %}?v=1.1"></script>
    <script>
        // Show loader on navigation away
        window.addEventListener('beforeunload', function() {
            var loader = document.getElementById('global-loader');
            if (loader) {
                loader.style.display = 'flex';
                loader.classList.remove('loader-fade-out');
            }
        });

        // Auto-dismiss messages after 5 seconds
        setTimeout(() => {
            const messages = document.querySelectorAll('.alert-msg');
            messages.forEach(msg => {
                msg.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                msg.style.opacity = '0';
                msg.style.transform = 'translateY(-20px)';
                setTimeout(() => msg.remove(), 500);
            });
        }, 5000);
    </script>
</body>

</html>
